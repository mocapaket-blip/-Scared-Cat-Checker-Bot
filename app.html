<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Scared Cats — Верификация</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ============ Scared Cat dark/neon theme ============ */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg-0:      #0a0a0a;          /* глубокий чёрный */
      --bg-1:      #141414;          /* фон карточек */
      --bg-2:      #1f1f1f;          /* поверхности */
      --neon:      #39ff14;          /* неоновый зелёный (фирменный Scared Cat) */
      --neon-soft: rgba(57,255,20,0.12);
      --neon-mid:  rgba(57,255,20,0.40);
      --text:      #e8ffe6;
      --hint:      #6f7a6c;
      --danger:    #ff453a;
      --warn:      #ffb454;
    }

    html, body {
      background: radial-gradient(circle at 50% 0%, #0e1a0e 0%, var(--bg-0) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 32px 20px 40px;
    }

    /* ===== HERO ===== */
    .hero {
      width: 100%;
      max-width: 360px;
      text-align: center;
      margin-bottom: 28px;
    }

    .cat {
      font-size: 84px;
      line-height: 1;
      filter: drop-shadow(0 0 24px var(--neon-mid));
      animation: float 4s ease-in-out infinite;
      margin-bottom: 8px;
    }
    @keyframes float {
      0%,100% { transform: translateY(0) }
      50%     { transform: translateY(-6px) }
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #fff 0%, var(--neon) 120%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--hint);
      line-height: 1.5;
    }

    /* ===== CARDS / BUTTONS ===== */
    .actions {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--bg-1);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: all .18s ease;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--neon-soft), transparent 60%);
      opacity: 0;
      transition: opacity .18s ease;
      pointer-events: none;
    }
    .card:active {
      transform: scale(0.98);
      border-color: var(--neon-mid);
    }
    .card:active::before { opacity: 1; }
    .card.disabled {
      opacity: 0.5;
      pointer-events: none;
    }

    .card-icon {
      width: 52px; height: 52px;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-2);
      border-radius: 14px;
      font-size: 26px;
      border: 1px solid rgba(57,255,20,0.15);
    }
    .card-body { flex: 1; min-width: 0; }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 3px;
    }
    .card-desc {
      font-size: 12.5px;
      color: var(--hint);
      line-height: 1.4;
    }
    .card-arrow {
      color: var(--neon);
      font-size: 22px;
      font-weight: 300;
      flex-shrink: 0;
    }

    /* primary vs secondary */
    .card.primary {
      background: linear-gradient(140deg, #0f1f0f 0%, var(--bg-1) 70%);
      border-color: rgba(57,255,20,0.30);
      box-shadow: 0 0 24px rgba(57,255,20,0.08);
    }

    /* ===== STATUS ===== */
    .status {
      display: none;
      width: 100%;
      max-width: 360px;
      margin-top: 18px;
      padding: 16px 18px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      border: 1px solid transparent;
    }
    .status.show { display: block; }
    .status.info {
      background: rgba(57,255,20,0.06);
      border-color: rgba(57,255,20,0.25);
      color: var(--neon);
    }
    .status.success {
      background: rgba(57,255,20,0.10);
      border-color: var(--neon);
      color: var(--neon);
      box-shadow: 0 0 22px rgba(57,255,20,0.18);
    }
    .status.error {
      background: rgba(255,69,58,0.08);
      border-color: rgba(255,69,58,0.4);
      color: var(--danger);
    }
    .status.warn {
      background: rgba(255,180,84,0.08);
      border-color: rgba(255,180,84,0.4);
      color: var(--warn);
    }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: -2px;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .footer {
      margin-top: auto;
      padding-top: 24px;
      font-size: 11px;
      color: var(--hint);
      text-align: center;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .footer .dot { color: var(--neon); }

    code {
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 12px;
      background: rgba(57,255,20,0.08);
      padding: 1px 5px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
<div class="page">

  <div class="hero">
    <div class="cat">🐈‍⬛</div>
    <h1>SCARED CATS</h1>
    <p class="subtitle">Подтверди, что ты владелец<br>NFT или подарка Scared Cat</p>
  </div>

  <div class="actions">
    <div class="card primary" id="wallet-card">
      <div class="card-icon">🔗</div>
      <div class="card-body">
        <div class="card-title">TON-кошелёк</div>
        <div class="card-desc">Подключить через TON Connect и проверить NFT</div>
      </div>
      <div class="card-arrow">›</div>
    </div>

    <div class="card" id="gift-card">
      <div class="card-icon">🎁</div>
      <div class="card-body">
        <div class="card-title">Подарок Telegram</div>
        <div class="card-desc">Проверить подарок Scared Cat в твоём профиле</div>
      </div>
      <div class="card-arrow">›</div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <div class="footer">
    Powered by <span class="dot">●</span> TON Connect
  </div>
</div>

<script type="module">
  // ─── Telegram WebApp ───────────────────────────────────────────
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#0a0a0a');
  tg.setBackgroundColor('#0a0a0a');

  const MANIFEST = 'https://mocapaket-blip.github.io/-Scared-Cat-Checker-Bot/tonconnect-manifest.json';

  const $ = id => document.getElementById(id);

  function setStatus(msg, type = 'info') {
    const el = $('status');
    el.innerHTML = msg;
    el.className = 'status show ' + type;
  }

  function setBusy(busy) {
    $('wallet-card').classList.toggle('disabled', busy);
    $('gift-card').classList.toggle('disabled', busy);
  }

  function haptic(kind) {
    try {
      if (kind === 'success' || kind === 'error' || kind === 'warning')
        tg.HapticFeedback.notificationOccurred(kind);
      else
        tg.HapticFeedback.impactOccurred(kind || 'medium');
    } catch (e) { /* old TG client */ }
  }

  function shorten(addr) {
    if (!addr || addr.length < 12) return addr;
    return addr.slice(0, 6) + '…' + addr.slice(-4);
  }

  // ─── Gift check ────────────────────────────────────────────────
  $('gift-card').addEventListener('click', () => {
    haptic('medium');
    setStatus('<span class="spinner"></span>Запрашиваю проверку подарков…', 'info');
    setBusy(true);
    setTimeout(() => {
      try {
        tg.sendData(JSON.stringify({ action: 'check_gift' }));
        // Telegram автоматически закроет Mini App после sendData
      } catch (e) {
        setStatus('Ошибка: ' + e.message, 'error');
        setBusy(false);
      }
    }, 250);
  });

  // ─── TON Connect ───────────────────────────────────────────────
  let tcUI = null;
  let prevWallet = null;

  async function initTonConnect() {
    try {
      const { TonConnectUI } = await import(
        'https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.esm.js'
      );

      tcUI = new TonConnectUI({ manifestUrl: MANIFEST });
      prevWallet = tcUI.wallet;

      if (prevWallet) {
        const short = shorten(prevWallet.account.address);
        setStatus(`Кошелёк подключён: <code>${short}</code><br>Нажми «TON-кошелёк» для перепроверки.`, 'info');
      }

      tcUI.onStatusChange(wallet => {
        if (wallet && !prevWallet) {
          // Новое подключение — отправляем данные боту
          haptic('success');
          const address = wallet.account.address;
          setStatus(`✅ Кошелёк подключён: <code>${shorten(address)}</code><br>Проверяю NFT…`, 'success');
          setBusy(true);
          setTimeout(() => {
            try {
              tg.sendData(JSON.stringify({ action: 'wallet', address }));
            } catch (e) {
              setStatus('Ошибка отправки: ' + e.message, 'error');
              setBusy(false);
            }
          }, 600);
        }
        prevWallet = wallet;
      });

    } catch (e) {
      console.error('TonConnect init error:', e);
      setStatus('Не удалось загрузить TON Connect. Обнови страницу.', 'error');
    }
  }

  initTonConnect();

  $('wallet-card').addEventListener('click', async () => {
    haptic('medium');

    if (!tcUI) {
      setStatus('<span class="spinner"></span>TON Connect ещё загружается…', 'info');
      return;
    }

    // Уже подключён — сразу шлём боту для перепроверки
    if (tcUI.wallet) {
      const address = tcUI.wallet.account.address;
      setStatus('<span class="spinner"></span>Проверяю NFT…', 'info');
      setBusy(true);
      setTimeout(() => {
        tg.sendData(JSON.stringify({ action: 'wallet', address }));
      }, 250);
      return;
    }

    // Открываем модал TON Connect
    setStatus('<span class="spinner"></span>Открываю список кошельков…', 'info');
    setBusy(true);
    try {
      await tcUI.openModal();
    } catch (e) {
      setStatus('Не удалось открыть TON Connect: ' + e.message, 'error');
      setBusy(false);
    }

    if (typeof tcUI.onModalStateChange === 'function') {
      tcUI.onModalStateChange(state => {
        if ((!state.status || state.status === 'closed') && !tcUI.wallet) {
          setBusy(false);
          setStatus('Подключение отменено.', 'warn');
        }
      });
    }
  });
</script>
</body>
</html>
