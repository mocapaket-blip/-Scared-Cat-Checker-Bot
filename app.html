<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Scared Cats — TON Кошелёк</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        var(--tg-theme-bg-color, #1c1c1e);
      --text:      var(--tg-theme-text-color, #ffffff);
      --hint:      var(--tg-theme-hint-color, #8e8e93);
      --btn:       var(--tg-theme-button-color, #5288c1);
      --btn-text:  var(--tg-theme-button-text-color, #ffffff);
      --sec-bg:    var(--tg-theme-secondary-bg-color, #2c2c2e);
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      overscroll-behavior: none;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 24px;
    }

    .logo { font-size: 72px; line-height: 1; margin-bottom: 16px; }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      text-align: center;
    }

    .subtitle {
      font-size: 14px;
      color: var(--hint);
      text-align: center;
      line-height: 1.5;
      margin-bottom: 40px;
      max-width: 280px;
    }

    .btn {
      width: 100%;
      max-width: 320px;
      padding: 16px 20px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      background: var(--btn);
      color: var(--btn-text);
    }
    .btn:active  { opacity: 0.75; transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .status {
      display: none;
      width: 100%;
      max-width: 320px;
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }
    .status.show { display: block; }
    .status.info    { background: rgba(0,122,255,0.15);  color: #409cff; }
    .status.success { background: rgba(52,199,89,0.15);  color: #34c759; }
    .status.error   { background: rgba(255,59,48,0.15);  color: #ff453a; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid currentColor;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hint-text {
      margin-top: 16px;
      font-size: 12px;
      color: var(--hint);
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
<div class="page">
  <div class="logo">😱🐱</div>
  <h1>Scared Cats</h1>
  <p class="subtitle">Подключи TON-кошелёк с NFT Scared Cats,<br>чтобы получить доступ к чату</p>

  <button class="btn" id="wallet-btn">
    🔗 Подключить TON-кошелёк
  </button>

  <div class="status" id="status"></div>

  <p class="hint-text" id="hint">
    Поддерживаются Tonkeeper, MyTonWallet, Wallet и другие кошельки с TON Connect.
  </p>
</div>

<script type="module">
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const MANIFEST = 'https://mocapaket-blip.github.io/-Scared-Cat-Checker-Bot/tonconnect-manifest.json';

  function setStatus(msg, type = 'info') {
    const el = document.getElementById('status');
    el.innerHTML = msg;
    el.className = 'status show ' + type;
  }

  function setLoading(val) {
    const btn = document.getElementById('wallet-btn');
    btn.disabled = val;
    if (val) {
      btn.innerHTML = '<span class="spinner"></span>&nbsp; Подключаю…';
    } else {
      btn.innerHTML = '🔗 Подключить TON-кошелёк';
    }
  }

  // ── TON Connect init ────────────────────────────────────────────
  let tcUI = null;
  let prevWallet = null;

  async function initTonConnect() {
    try {
      const { TonConnectUI } = await import(
        'https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.esm.js'
      );

      tcUI = new TonConnectUI({ manifestUrl: MANIFEST });

      // Запоминаем текущее состояние (если уже подключён с прошлого раза)
      prevWallet = tcUI.wallet;

      if (prevWallet) {
        // Кошелёк уже подключён — показываем адрес
        const short = shortenAddress(prevWallet.account.address);
        setStatus(`Кошелёк уже подключён:<br><code>${short}</code><br>Нажми кнопку для повторной проверки.`, 'info');
        const btn = document.getElementById('wallet-btn');
        btn.innerHTML = '🔄 Перепроверить кошелёк';
      }

      // Слушаем новые подключения
      tcUI.onStatusChange(wallet => {
        if (wallet && !prevWallet) {
          // Новое подключение
          const address = wallet.account.address;
          tg.HapticFeedback.notificationOccurred('success');
          setStatus('✅ Кошелёк подключён! Отправляю боту для проверки NFT…', 'success');
          document.getElementById('hint').style.display = 'none';
          setTimeout(() => {
            try {
              tg.sendData(JSON.stringify({ action: 'wallet', address }));
            } catch (e) {
              setStatus('Ошибка отправки данных: ' + e.message, 'error');
              setLoading(false);
            }
          }, 600);
        }
        prevWallet = wallet;
      });

    } catch (e) {
      console.error('TonConnect init error:', e);
      setStatus('Ошибка загрузки TON Connect. Попробуй обновить страницу.', 'error');
    }
  }

  function shortenAddress(addr) {
    if (!addr || addr.length < 12) return addr;
    return addr.slice(0, 6) + '…' + addr.slice(-4);
  }

  initTonConnect();

  // ── Wallet button click ─────────────────────────────────────────
  document.getElementById('wallet-btn').addEventListener('click', async () => {
    tg.HapticFeedback.impactOccurred('medium');

    if (!tcUI) {
      setStatus('<span class="spinner"></span>&nbsp; TON Connect ещё загружается…', 'info');
      return;
    }

    // Если кошелёк уже подключён — сразу отправляем данные боту
    if (tcUI.wallet) {
      const address = tcUI.wallet.account.address;
      setStatus('<span class="spinner"></span>&nbsp; Проверяю NFT…', 'info');
      setLoading(true);
      setTimeout(() => {
        try {
          tg.sendData(JSON.stringify({ action: 'wallet', address }));
        } catch (e) {
          setStatus('Ошибка: ' + e.message, 'error');
          setLoading(false);
        }
      }, 300);
      return;
    }

    // Открываем модал выбора кошелька
    setLoading(true);
    try {
      await tcUI.openModal();
      // Дальше onStatusChange поймает подключение
    } catch (e) {
      setStatus('Не удалось открыть TON Connect: ' + e.message, 'error');
      setLoading(false);
    }

    // Кнопка разблокируется после закрытия модала без подключения
    tcUI.onModalStateChange(state => {
      if (!state.status || state.status === 'closed') {
        if (!tcUI.wallet) {
          setLoading(false);
        }
      }
    });
  });
</script>
</body>
</html>
